[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "vidsgen-backend"
version = "0.2.0"
description = "VIDSGEN API: video-generation jobs, storage and pluggable inference providers"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115,<1.0",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.7,<3",
    "pydantic-settings>=2.3,<3",
    "python-multipart>=0.0.9",   # multipart/form-data (image uploads)
    "pillow>=10.3",              # image validation / normalisation
    "numpy>=1.26",               # mock provider frame synthesis
    "imageio-ffmpeg>=0.5",       # bundled ffmpeg binary for the mock provider's MP4 encoding
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "httpx2>=2.16",              # FastAPI/Starlette TestClient (successor of httpx for starlette>=1.x)
]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra"
# Leaked files/sockets/processes fail the suite instead of passing silently.
filterwarnings = [
    "error::ResourceWarning",
    "error::pytest.PytestUnraisableExceptionWarning",
    "error::DeprecationWarning:app.*",
]
