# Exact model components for Wan 2.2 TI2V-5B in ComfyUI.
# Used by scripts/download_models.py and the Kaggle notebook (notebooks/kaggle_comfyui_wan22.ipynb).
# Weights are downloaded at runtime and are NEVER committed.
#
# License: Wan 2.2 is Apache-2.0 (Wan-AI/Wan2.2-TI2V-5B model card).
#
# --- How the integrity fields were established (2026-11-20) -----------------------------------
# Each repository's `revision` is the commit that `main` pointed to when this was recorded
# (GET https://huggingface.co/api/models/<repo>/revision/main -> sha). Downloads are pinned to it,
# so a later change to `main` can never alter what is downloaded.
#
# `sha256` is the SHA-256 of the FILE CONTENT. For these Git-LFS files Hugging Face stores it as the
# LFS object id, and it was read from two independent sources that agreed exactly:
#   1. GET https://huggingface.co/api/models/<repo>/paths-info/<revision>   -> lfs.oid
#   2. HEAD https://huggingface.co/<repo>/resolve/<revision>/<path> (redirects off) -> x-linked-etag
# `size_bytes` agreed across: this manifest, paths-info lfs.size and the x-linked-size header.
#
# Other identifiers Hugging Face returns for the same files are NOT SHA-256 and are not used:
#   * xetHash / x-xet-hash : the Xet storage chunk-tree hash, a different algorithm.
#   * oid (non-LFS)        : the Git blob id of the ~135-byte LFS pointer file, not of the weights.
#
# The downloader refuses to download any file whose `revision` or `sha256` is missing or malformed,
# and deletes any file whose size or SHA-256 does not match.
