# Exact model components for Wan 2.2 TI2V-5B in ComfyUI.
# Verified on Hugging Face (file paths and byte sizes) on 2026-11-19.
# Used by scripts/download_models.py (Phase 4) and the Kaggle notebook.
# Weights are downloaded at runtime and are NEVER committed.
#
# License: Wan 2.2 is Apache-2.0 (Wan-AI/Wan2.2-TI2V-5B model card).

model: wan2.2-ti2v-5b
native_output:
  resolutions: ["1280x704", "704x1280"]   # TI2V-5B's 720p sizes
  fps: 24
  frame_rule: "4k+1"                      # e.g. 49, 73, 97, 121 (121 ~= 5 s)

files:
  - role: diffusion_model
    repo: Comfy-Org/Wan_2.2_ComfyUI_Repackaged
    path: split_files/diffusion_models/wan2.2_ti2v_5B_fp16.safetensors
    comfyui_dir: models/diffusion_models
    size_bytes: 9999658848          # ~10.0 GB (no official fp8 build of the 5B exists)

  - role: vae
    repo: Comfy-Org/Wan_2.2_ComfyUI_Repackaged
    path: split_files/vae/wan2.2_vae.safetensors
    comfyui_dir: models/vae
    size_bytes: 1409400960          # ~1.4 GB. MUST be the Wan 2.2 VAE; the 2.1 VAE is incompatible.

  - role: text_encoder
    repo: Comfy-Org/Wan_2.1_ComfyUI_repackaged
    path: split_files/text_encoders/umt5_xxl_fp8_e4m3fn_scaled.safetensors
    comfyui_dir: models/text_encoders
    size_bytes: 6735906897          # ~6.7 GB. fp8 chosen over fp16 (11.4 GB) to fit Kaggle RAM/VRAM.

total_download_gb: 18.1

# Explicitly NOT compatible with this pipeline (do not mix in):
incompatible:
  - "Wan 2.2 14B T2V/I2V high_noise / low_noise models (different architecture, far more VRAM)"
  - "wan2.2_fun_* 5B/14B variants (different conditioning inputs)"
  - "Wan 2.1 VAE (wan_2.1_vae.safetensors)"
